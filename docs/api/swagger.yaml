      operationId: icebergLoadTable
      summary: Load a table
      description: The returned metadata always carries `gc.enabled=false` in `properties`.
      security: *iceberg
      responses:
        '200':
          description: Table metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcebergLoadTableResult'
        '400':
          $ref: '#/components/responses/IcebergError'
        '401':
          $ref: '#/components/responses/IcebergUnauthorized'
        '403':
          $ref: '#/components/responses/IcebergForbidden'
        '404':
          $ref: '#/components/responses/IcebergError'
        '500':
          $ref: '#/components/responses/IcebergError'
        '503':
          $ref: '#/components/responses/IcebergError'
