      description: |
        Loopback clients only and only with the shutdown token from `backend.json`:
        401 without a Bearer token, 403 wrong token, non-loopback client or untrusted Host,
        404 when the app runs without lifecycle control.
      security:
        - shutdownBearer: []
      responses:
        '202':
          description: Shutdown requested.
          content:
