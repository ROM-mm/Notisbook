      required: [key, label, kernel_name, formats, image, container_name, dockerfile, available, installed, busy, job, image_present, image_size, container, mounts, versions]
      properties:
        key:
          type: string
        label:
          type: string
        kernel_name:
          type: string
        formats:
          type: array
          items:
            type: string
        image:
          type: string
        container_name:
          type: string
        dockerfile:
          type: object
          required: [path, text, base_image, base_digest]
          properties:
            path:
              type: string
            text:
              type: string
            base_image:
              type: string
              nullable: true
            base_digest:
              type: string
              nullable: true
        available:
