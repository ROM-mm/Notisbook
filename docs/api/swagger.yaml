      type: object
      additionalProperties: false
      description: |
        `created`, `updated` and `renamed` items are validated one by one; an item that only
        exceeds size/pattern limits is rejected (`item_limits`) without failing the plan.
        At most 1000 table items in total.
      properties:
        created:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/RuntimeCreated'
        updated:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/RuntimeUpdated'
        renamed:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/RuntimeRenamed'
        dropped:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/RuntimeDropped'
        unregistered:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/RuntimeDropped'
        new_dbs:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/RuntimeName'
        gone_dbs:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/RuntimeName'
