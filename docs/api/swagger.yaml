  /api/jobs/{job_id}/events:
    get:
      tags: [Jobs]
      operationId: jobEvents
      summary: Job event stream (WebSocket upgrade)
      description: |
        WebSocket endpoint (HTTP Upgrade). Same handshake guard as `/api/ws/ping`; failure refuses the
        handshake (HTTP 403). Unknown job: accepted then closed with code 4404.

        Server -> client only: one JSON frame per `JobEvent` `{phase, line, progress?}`. The accumulated
        log is replayed first, then live events; the stream ends with the terminal event
        (`phase: done`, `line` = `succeeded`/`failed[: error]`, `progress: 1.0`) and the server closes the
        connection. Client frames are ignored (only used to detect disconnection).
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '101':
          description: Switching Protocols (WebSocket accepted).
        '403':
          description: Handshake refused (token, Origin or Host check failed).
