    post:
      tags: [iceberg]
      operationId: icebergCommitTable
      summary: Commit table updates
      description: 409 CommitFailedException for a violated requirement or lost CAS; 500 CommitStateUnknownException when the state is unknown.
      security: *iceberg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IcebergCommitTableRequest'
      responses:
        '200':
