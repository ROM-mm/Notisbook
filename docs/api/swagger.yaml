          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenHost'
        '422':
          description: 'Field error list (`[{loc, msg, type}]`, no input echo) or `{code: secret_required, message}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
    delete:
      tags: [Notislake]
      operationId: deleteNotislakeConfig
      summary: Remove the manual configuration (back to automatic)
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenHost'
  /api/notislake/objects:
    get:
      tags: [Notislake]
      operationId: listNotislakeObjects
      summary: List one page of the notislake bucket
      parameters:
        - name: prefix
          in: query
          required: false
          description: Must not start with `/`, contain control characters or backslash, or `.`/`..` segments.
          schema:
            type: string
            maxLength: 1024
            default: ''
        - name: max_keys
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: continuation_token
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
      responses:
        '200':
          description: Page of objects and common prefixes.
          content:
            application/json:
              schema:
                type: object
                required: [source, bucket, prefix, prefixes, objects, is_truncated, next_continuation_token]
                properties:
                  source:
                    type: string
                  bucket:
                    type: string
                  prefix:
                    type: string
                  prefixes:
                    type: array
                    items:
                      type: string
                  objects:
                    type: array
                    items:
                      type: object
                      required: [key, size, last_modified]
                      properties:
                        key:
                          type: string
                        size:
                          type: integer
                        last_modified:
                          type: string
                          format: date-time
                          nullable: true
                  is_truncated:
                    type: boolean
                  next_continuation_token:
                    type: string
                    nullable: true
        '400':
          $ref: '#/components/responses/CodedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenHost'
        '409':
          $ref: '#/components/responses/CodedError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/CodedError'
        '503':
          $ref: '#/components/responses/CodedError'
        '504':
          $ref: '#/components/responses/CodedError'
  /api/notislake/test:
    post:
      tags: [Notislake]
      operationId: testNotislakeConnection
      summary: Probe a draft configuration (or the current connection without body)
      description: 'Upstream failures are reported in the 200 body (`ok: false`), not as HTTP errors.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotislakeConfigBody'
      responses:
        '200':
          description: Categorical probe result.
          content:
            application/json:
              schema:
                type: object
                required: [ok, source]
                properties:
                  ok:
                    type: boolean
                  source:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenHost'
        '409':
          description: '`test_in_progress` or `config_invalid`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/CodedError'
  /api/lifecycle/shutdown:
    post:
      tags: [Lifecycle]
      operationId: shutdownBackend
      summary: Trigger an orderly shutdown
      description: |
        Only from a loopback client and only with the shutdown token stored in `<home>/run/backend.json`
        (distinct from the UI token). Returns 404 when the app runs without lifecycle control.
      security:
        - shutdownBearer: []
      responses:
        '202':
          description: Shutdown requested.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [stopping]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden Host, non-loopback client, or wrong token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    uiBearer:
      type: http
      scheme: bearer
      description: 'UI token (generated per process start) in `Authorization: Bearer <token>`. Checked first.'
    uiCookie:
      type: apiKey
      in: cookie
      name: notisbook_token
      description: UI token in the `notisbook_token` cookie (HttpOnly, SameSite=Strict, path `/`), set by the server when a request authenticates through the `token` query parameter.
    uiQueryToken:
      type: apiKey
      in: query
      name: token
      description: UI token in the `token` query parameter; on success the response sets the `notisbook_token` cookie. The browser opens `/?token=...` at startup.
    runtimeBearer:
      type: http
      scheme: bearer
      description: 'Per-session runtime token of a Docker/DuckDB kernel in `Authorization: Bearer <token>`. Accepted only on `/api/runtime-catalog/*` and `/iceberg/*`; the UI token is not accepted there and vice versa.'
    shutdownBearer:
      type: http
      scheme: bearer
      description: Shutdown token written to `<home>/run/backend.json` (file mode 0600); accepted only by `/api/lifecycle/shutdown`.
  parameters:
    OriginHeader:
      name: Origin
      in: header
      required: true
      description: Must be `http://127.0.0.1:{port}` or `http://localhost:{port}` for the WebSocket handshake.
      schema:
        type: string
    RootGeneration:
      name: X-Notisbook-Root-Generation
      in: header
      required: false
      description: Root generation seen by the client; if present and different from the current one the server answers 409 `root_changed`. Absent header is accepted.
      schema:
        type: string
    ContentPath:
      name: path
      in: path
      required: true
      description: Path relative to the notebooks root; may contain `/` (FastAPI `path` converter).
      schema:
        type: string
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    Version:
      name: version
      in: path
      required: true
      description: Version like `3.5.9` (Spark) or `2.0.1` (DuckDB); an invalid format yields 422.
      schema:
        type: string
    RuntimeKey:
      name: key
      in: path
      required: true
      description: Docker runtime key from the built-in catalog; unknown keys yield 404.
      schema:
        type: string
    ConnectionsDir:
      name: connections_dir
      in: query
      required: false
      description: The client's Connections folder.
      schema:
        type: string
        maxLength: 4096
    CatalogName:
      name: catalog
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    SchemaName:
      name: schema
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    IcebergNamespacePath:
      name: namespace
      in: path
      required: true
      description: Namespace levels separated by the 0x1F character; at most 255 characters.
      schema:
        type: string
    IcebergTablePath:
      name: table
      in: path
      required: true
      schema:
        type: string
        maxLength: 255
  requestBodies:
    AddPackages:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [requirements]
            properties:
              requirements:
                type: array
                minItems: 1
                maxItems: 50
                items:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                    spec:
                      type: string
                      default: ''
                      description: Version specifier.
    PackageNames:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [names]
            properties:
              names:
                type: array
                minItems: 1
                maxItems: 500
                items:
                  type: string
  responses:
    Unauthorized:
      description: Missing or invalid token (`detail` = `Unauthorized`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPError'
    ForbiddenHost:
      description: Host header not allowed (`detail` = `Forbidden host`), checked after the token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPError'
    Error:
      description: Error with a `detail` message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPError'
    CodedError:
      description: Error with `detail = {code, message, ...}`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CodedHTTPError'
    SchemaError:
      description: |
        Schema operation refused; `detail` is a code: `invalid_catalog`, `invalid_name`, `reserved_name` (400),
        `schema_not_found` (404), `schema_exists`, `catalog_changed`, `cannot_drop_default`, `cannot_drop_layer`,
        `has_child_namespaces`, `unsupported_iceberg_catalog_schema` (409).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPError'
    CatalogBusy:
      description: Catalog database busy or unavailable (`catalog_busy` / `catalog_unavailable`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPError'
    ValidationError:
      description: Request validation error (FastAPI default body).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorBody'
    IcebergError:
      description: Iceberg REST error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IcebergErrorModel'
    JobStarted:
      description: Job started; follow it via `/api/jobs/{job_id}` or its events WebSocket.
      content:
        application/json:
          schema:
            type: object
            required: [job_id]
            properties:
              job_id:
                type: string
    PackagesList:
      description: Libraries of the version, without the protected core ones, plus the job holding its lock.
      content:
        application/json:
          schema:
            type: object
            required: [version, kernel_name, env_dir, job_id, job_action, packages]
            properties:
              version:
                type: string
              kernel_name:
                type: string
              env_dir:
                type: string
              job_id:
                type: string
                nullable: true
              job_action:
                type: string
                nullable: true
              packages:
                type: array
                items:
                  type: object
                  required: [name, version]
                  properties:
                    name:
                      type: string
                    version:
                      type: string
  schemas:
    HTTPError:
      type: object
      required: [detail]
      properties:
        detail:
          description: A message string, an object (`{code, message, ...}`) or a list of `{loc, msg, ...}` errors, depending on the route.
    CodedHTTPError:
      type: object
      required: [detail]
      properties:
        detail:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
          additionalProperties: true
    ValidationErrorBody:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            required: [loc, msg]
            properties:
              loc:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              msg:
                type: string
              type:
                type: string
            additionalProperties: true
    IcebergErrorModel:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, code]
          properties:
            message:
              type: string
            type:
              type: string
              description: Exception type, e.g. `BadRequestException`, `NotAuthorizedException`, `ForbiddenException`, `NoSuchNamespaceException`, `NoSuchTableException`, `AlreadyExistsException`, `CommitFailedException`, `NamespaceNotEmptyException`, `UnprocessableEntityException`, `ServiceFailureException`, `CommitStateUnknownException`, `ServiceUnavailableException`, `NoSuchRouteException`.
            code:
              type: integer
    UsedTotal:
      type: object
      nullable: true
      required: [used, total]
      properties:
        used:
          type: integer
        total:
          type: integer
    Prereqs:
      type: object
      required: [uv, java, java_home]
      properties:
        uv:
          type: object
          required: [found, version]
          properties:
            found:
              type: boolean
            version:
              type: string
              nullable: true
        java:
          type: object
          required: [version, ok, jdks, spark3_ok, spark4_ok]
          properties:
            version:
              type: string
              nullable: true
            ok:
              type: boolean
            jdks:
              type: array
              items:
                type: object
                required: [version, home]
                properties:
                  version:
                    type: string
                  home:
                    type: string
            spark3_ok:
              type: boolean
            spark4_ok:
              type: boolean
        java_home:
          type: string
          nullable: true
    Notebook:
      type: object
      description: Jupyter notebook in nbformat v4 (validated server-side; full schema not reproduced here).
      additionalProperties: true
    ContentEntry:
      type: object
      required: [name, path, type, mtime, size]
      properties:
        name:
          type: string
        path:
          type: string
        type:
          type: string
          enum: [dir, notebook, file]
        mtime:
          type: number
        size:
          type: integer
          nullable: true
    DirectoryListing:
      type: object
      required: [path, parent, entries, total, truncated, next_offset]
      properties:
        path:
          type: string
        parent:
          type: string
          nullable: true
        entries:
          type: array
          items:
            type: object
            required: [name, path, is_dir, is_symlink, size, mtime]
            properties:
              name:
                type: string
              path:
                type: string
              is_dir:
                type: boolean
              is_symlink:
                type: boolean
              size:
                type: integer
                nullable: true
              mtime:
                type: number
                nullable: true
        total:
          type: integer
        truncated:
          type: boolean
        next_offset:
          type: integer
          nullable: true
    NotebooksRoot:
      type: object
      required: [path, name, source, locked, generation]
      properties:
        path:
          type: string
        name:
          type: string
        source:
          type: string
          enum: [cli, saved, default]
        locked:
          type: boolean
        generation:
          type: integer
    RuntimeKind:
      type: string
      enum: [duckdb, docker, local]
    KernelSpecInfo:
      type: object
      required: [name, display_name, language, cell_languages, runtime_kind]
      properties:
        name:
          type: string
        display_name:
          type: string
        language:
          type: string
        cell_languages:
          type: array
          items:
            type: string
            enum: [python, sql, duckdb]
        runtime_kind:
          $ref: '#/components/schemas/RuntimeKind'
    SessionInfo:
      type: object
      required: [session_id, path, kernel_name, state]
      properties:
        session_id:
          type: string
        path:
          type: string
        kernel_name:
          type: string
        state:
          type: string
          enum: [starting, idle, busy, restarting, dead]
    CatalogTableNode:
      type: object
      required: [name, namespace, format, table_type, is_temporary, location, available, description]
      description: Table node of `spark_catalog`/`hudi`; Iceberg table nodes are produced elsewhere (shape not fully resolved statically).
      properties:
        name:
          type: string
        namespace:
          type: array
          items:
            type: string
        format:
          type: string
        table_type:
          type: string
        is_temporary:
          type: boolean
        location:
          type: string
        available:
          type: boolean
        description:
          type: string
          nullable: true
      additionalProperties: true
    CatalogNode:
      type: object
      required: [name, databases]
      properties:
        name:
          type: string
          description: '`spark_catalog`, `iceberg` or `hudi`.'
        databases:
          type: array
          items:
            type: object
            required: [name, tables]
            properties:
              name:
                type: string
              tables:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogTableNode'
              truncated:
                type: boolean
        error:
          type: string
          description: Present only on a degraded `iceberg` node.
    CatalogTableInfo:
      type: object
      description: Table metadata. Nested shapes (`columns`, `history`, `properties`, `stats`) are not fully resolved statically.
      required: [catalog, database, table, format, table_type, drop_behavior, location, available]
      properties:
        catalog:
          type: string
        database:
          type: string
        table:
          type: string
        format:
          type: string
        table_type:
          type: string
        drop_behavior:
          type: string
          enum: [deletes_files, registry_only, registry_only_unless_purge]
        location:
          type: string
        available:
          type: boolean
        description:
          type: string
          nullable: true
        created_at: {}
        updated_at: {}
        partition_columns:
          type: array
          items:
            type: string
        columns:
          type: array
          items:
            type: object
            additionalProperties: true
        version:
          type: object
          nullable: true
          additionalProperties: true
        history: {}
        properties: {}
        stats: {}
        metadata_error: {}
      additionalProperties: true
    CatalogInfo:
      type: object
      description: Catalog overview. Only top-level keys are listed; nested shapes are not fully resolved statically.
      required: [name, kind, status]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [session, named, display_group]
        backing_catalog:
          type: string
          nullable: true
        status:
          type: string
        profile: {}
        implementation: {}
        type: {}
        warehouse: {}
        uri: {}
        file_io: {}
        counts:
          type: object
          properties:
            namespaces:
              type: integer
            tables:
              type: integer
            views:
              type: integer
        formats:
          type: object
          additionalProperties: true
        namespaces:
          type: array
          items: {}
        namespaces_truncated:
          type: boolean
        config:
          type: array
          items:
            type: object
            required: [key, value, redacted]
            properties:
              key:
                type: string
              value: {}
              redacted:
                type: boolean
      additionalProperties: true
    SchemaPreview:
      type: object
      required: [tables, hudi, views, managed, managed_kept, external, can_delete, reason, etag]
      properties:
        tables:
          type: integer
        hudi:
          type: integer
        views:
          type: integer
        managed:
          type: integer
          description: Always 0 (the backend does not delete files).
        managed_kept:
          type: integer
        external:
          type: integer
        can_delete:
          type: boolean
        reason:
          type: string
          nullable: true
          enum: [cannot_drop_default, cannot_drop_layer, has_child_namespaces, null]
        etag:
          type: string
    SchemaDeleteResult:
      type: object
      required: [dropped_tables, dropped_views, files_deleted, files_kept, folder_kept]
      properties:
        dropped_tables:
          type: integer
        dropped_views:
          type: integer
        files_deleted:
          type: array
          items: {}
          description: Always empty.
        files_kept:
          type: array
          items:
            type: object
            required: [table, reason]
            properties:
              table:
                type: string
              reason:
                type: string
                enum: [s3a_kept, outside_warehouse]
        folder_kept:
          type: boolean
    RuntimeColumn:
      type: object
      additionalProperties: false
      required: [name, data_type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        data_type:
          type: string
          maxLength: 20000
        nullable:
          type: boolean
          default: true
        is_partition:
          type: boolean
          default: false
        description:
          type: string
          nullable: true
          maxLength: 4096
    RuntimeTableInfo:
      type: object
      required: [fmt, loc, cols, parts]
      properties:
        fmt:
          type: string
          enum: [delta, parquet, hudi]
        loc:
          type: string
          minLength: 1
          maxLength: 4096
        cols:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/RuntimeColumn'
        parts:
          type: array
          maxItems: 2000
          items:
            type: string
            maxLength: 256
        dv:
          type: integer
          minimum: 0
          nullable: true
        hi:
          type: string
          maxLength: 64
          nullable: true
    RuntimeName:
      type: string
      pattern: '^[A-Za-z0-9_][A-Za-z0-9_$-]*$'
      minLength: 1
      maxLength: 128
    RuntimeTableRef:
      type: object
      additionalProperties: false
      required: [db, name, expected_loc]
      properties:
        db:
          $ref: '#/components/schemas/RuntimeName'
        name:
          $ref: '#/components/schemas/RuntimeName'
        expected_loc:
          type: string
          minLength: 1
          maxLength: 4096
    RuntimePlan:
      type: object
      additionalProperties: false
      description: |
        Extra keys are forbidden at every level. Items in `created` (TableInfo + `db`, `name`,
        `type: MANAGED|EXTERNAL`, `description`), `updated` (TableInfo + `db`, `name`, `expected_loc`) and
        `renamed` (TableInfo + `old_db`, `old_name`, `new_db`, `new_name`, `expected_loc`) are validated one
        by one. At most 1000 table items in total.
      properties:
        created:
          type: array
          maxItems: 1000
          items:
            allOf:
              - $ref: '#/components/schemas/RuntimeTableInfo'
              - type: object
                required: [db, name, type]
                properties:
                  db:
                    $ref: '#/components/schemas/RuntimeName'
                  name:
                    $ref: '#/components/schemas/RuntimeName'
                  type:
                    type: string
                    enum: [MANAGED, EXTERNAL]
                  description:
                    type: string
                    nullable: true
                    maxLength: 4096
        updated:
          type: array
          maxItems: 1000
          items:
            allOf:
              - $ref: '#/components/schemas/RuntimeTableInfo'
              - $ref: '#/components/schemas/RuntimeTableRef'
        renamed:
          type: array
          maxItems: 1000
          items:
            allOf:
              - $ref: '#/components/schemas/RuntimeTableInfo'
              - type: object
                required: [old_db, old_name, new_db, new_name, expected_loc]
                properties:
                  old_db:
                    $ref: '#/components/schemas/RuntimeName'
                  old_name:
                    $ref: '#/components/schemas/RuntimeName'
                  new_db:
                    $ref: '#/components/schemas/RuntimeName'
                  new_name:
                    $ref: '#/components/schemas/RuntimeName'
                  expected_loc:
                    type: string
                    minLength: 1
                    maxLength: 4096
        dropped:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/RuntimeTableRef'
        unregistered:
          type: array
          maxItems: 1000
          description: Removed from the registry only; same shape as `dropped`.
          items:
            $ref: '#/components/schemas/RuntimeTableRef'
        new_dbs:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/RuntimeName'
        gone_dbs:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/RuntimeName'
    RuntimePlanResult:
      type: object
      description: Item keys are `[db, name]` pairs. `changed`, `adopted`, `conflicts`, `dropped_ok` come from the registry commit and their item shapes are not resolved statically.
      required: [changed, adopted, conflicts, rejected, updated_ok, renamed_ok, dropped_ok, files_kept, deletions, generation_before, generation]
      properties:
        changed: {}
        adopted: {}
        conflicts: {}
        rejected:
          type: array
          items:
            type: object
            required: [key, reason]
            properties:
              key:
                type: array
                items:
                  type: string
              reason:
                type: string
                description: e.g. `item_limits`, `location_not_local`, `location_outside_mounts`, `location_not_notislake`, `managed_location_rejected`, or a code from the registry commit.
        updated_ok:
          type: array
          items:
            type: object
            required: [key, type]
            properties:
              key: {}
              type:
                type: string
        renamed_ok:
          type: array
          items:
            type: object
            required: [old, new]
            properties:
              old: {}
              new: {}
        dropped_ok: {}
        files_kept:
          type: array
          items: {}
        deletions:
          type: array
          items:
            type: object
            required: [key, loc]
            properties:
              key: {}
              loc:
                type: string
        generation_before:
          type: integer
        generation:
          type: integer
    StringMap:
