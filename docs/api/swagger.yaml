        '404':
          $ref: '#/components/responses/IcebergError'
        '500':
          $ref: '#/components/responses/IcebergError'
        '503':
          $ref: '#/components/responses/IcebergError'
    head:
      tags: [Iceberg REST]
      operationId: icebergTableExists
      summary: Check table existence
      security:
        - runtimeBearer: []
      responses:
        '204':
          description: Table exists.
        '400':
          $ref: '#/components/responses/IcebergError'
        '401':
          $ref: '#/components/responses/IcebergError'
        '403':
          $ref: '#/components/responses/IcebergError'
        '404':
          $ref: '#/components/responses/IcebergError'
        '500':
          $ref: '#/components/responses/IcebergError'
        '503':
          $ref: '#/components/responses/IcebergError'
    post:
      tags: [Iceberg REST]
      operationId: icebergCommitTable
      summary: Commit table updates
      description: |
        Only a subset of update actions and requirements is accepted (others are 400). Changing the
        location of an existing table is refused. 409 `CommitFailedException` for a violated requirement
        or a lost CAS; 500 `CommitStateUnknownException` when registering the commit fails.
      security:
        - runtimeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requirements:
                  type: array
                  items:
                    type: object
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum:
                          - assert-create
                          - assert-table-uuid
                          - assert-ref-snapshot-id
                          - assert-last-assigned-field-id
                          - assert-current-schema-id
                          - assert-last-assigned-partition-id
                          - assert-default-spec-id
                          - assert-default-sort-order-id
                    additionalProperties: true
                updates:
                  type: array
                  items:
                    type: object
                    required: [action]
                    properties:
                      action:
                        type: string
                        enum:
                          - assign-uuid
                          - upgrade-format-version
                          - add-schema
                          - set-current-schema
                          - add-spec
                          - set-default-spec
                          - add-sort-order
                          - set-default-sort-order
                          - set-location
                          - set-properties
                          - remove-properties
                          - add-snapshot
                          - set-snapshot-ref
                          - remove-snapshots
                          - remove-snapshot-ref
                          - remove-partition-specs
                          - remove-schemas
                    additionalProperties: true
      responses:
        '200':
          description: Commit result (`config` is removed from the response).
          content:
            application/json:
              schema:
                type: object
                required: [metadata]
                properties:
                  metadata-location:
                    type: string
                  metadata:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/IcebergError'
        '401':
          $ref: '#/components/responses/IcebergError'
        '403':
          $ref: '#/components/responses/IcebergError'
        '404':
          $ref: '#/components/responses/IcebergError'
        '409':
          $ref: '#/components/responses/IcebergError'
        '422':
          $ref: '#/components/responses/IcebergError'
        '500':
          $ref: '#/components/responses/IcebergError'
    delete:
      tags: [Iceberg REST]
      operationId: icebergDropTable
      summary: Drop a table (registry row only)
      description: The backend never deletes table files. A purge of an `s3a` table is refused (400); a purge of a local table only removes the row.
      security:
        - runtimeBearer: []
      parameters:
        - name: purgeRequested
          in: query
          required: false
          schema:
