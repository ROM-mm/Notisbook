  /{path}:
    parameters:
      - name: path
        in: path
        required: true
        description: Any path not matched by another route (Starlette `path` converter; may contain `/`).
        schema:
          type: string
    get:
      tags: [frontend]
      operationId: spaGet
      summary: SPA fallback (public)
      description: |
        Serves a file of the built frontend or `index.html` (with a Content-Security-Policy header).
        Paths `api` and `api/*` answer 404. Without a frontend build, answers 503 with an HTML page.
      security: []
      responses:
        '200':
          description: Frontend file or `index.html`.
          content:
            text/html:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Error'
        '503':
          description: Frontend not built.
          content:
            text/html:
              schema:
                type: string
    head:
      tags: [frontend]
      operationId: spaHead
      summary: SPA fallback (public, HEAD)
      security: []
      responses:
        '200':
          description: Frontend file or `index.html` headers.
        '404':
          description: Paths `api` and `api/*`.
        '503':
          description: Frontend not built.
components:
  securitySchemes:
    uiBearer:
      type: http
      scheme: bearer
      description: 'UI token as `Authorization: Bearer <token>`.'
    uiCookie:
      type: apiKey
      in: cookie
      name: notisbook_token
      description: UI token as the `notisbook_token` cookie.
    uiQuery:
      type: apiKey
      in: query
      name: token
      description: UI token as `?token=`; a valid value sets the `notisbook_token` cookie (HttpOnly, SameSite=Strict).
    runtimeBearer:
      type: http
      scheme: bearer
      description: Per-session runtime token of a Docker or DuckDB kernel; header only.
    shutdownBearer:
      type: http
      scheme: bearer
      description: Per-run shutdown token stored in `<home>/run/backend.json`; header only.
  headers:
    NoStore:
      description: Set on every notislake response, including errors.
      schema:
        type: string
        enum: [no-store]
  parameters:
    RootGeneration:
      name: X-Notisbook-Root-Generation
      in: header
      required: false
      description: Expected notebooks-root generation; a mismatch yields 409 `root_changed`.
      schema:
        type: string
    ContentPath:
      name: path
      in: path
      required: true
      description: Path relative to the notebooks root (Starlette `path` converter; may contain `/`).
      schema:
        type: string
    CatalogName:
      name: catalog
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    DatabaseName:
      name: database
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    TableName:
      name: table
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    SchemaName:
      name: schema
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    SparkVersion:
      name: version
      in: path
      required: true
      description: Spark version such as `3.5.9`.
      schema:
        type: string
    DockerKey:
      name: key
      in: path
      required: true
      description: Docker runtime key from the runtime catalog.
      schema:
        type: string
    ConnectionsDir:
      name: connections_dir
      in: query
      required: false
      description: Client Connections folder.
      schema:
        type: string
        maxLength: 4096
    IcebergNamespace:
      name: namespace
      in: path
      required: true
      description: Namespace levels separated by 0x1F (max 255 characters).
      schema:
        type: string
        maxLength: 255
    IcebergTable:
      name: table
      in: path
      required: true
      schema:
        type: string
        maxLength: 255
  responses:
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPError'
          example:
            detail: Unauthorized
    ForbiddenHost:
      description: Host header outside the allowed hosts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPError'
          example:
            detail: Forbidden host
    Error:
      description: Error raised with `HTTPException`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPError'
    ValidationError:
      description: Request validation error (FastAPI).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPValidationError'
    NoStoreUnauthorized:
      description: Missing or invalid token.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPError'
    NoStoreError:
      description: Error with `Cache-Control` no-store; 422 bodies never echo input values.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPError'
    JobAccepted:
      description: Job started; follow it via `GET /api/jobs/{job_id}` or the job events WebSocket.
      content:
        application/json:
          schema:
            type: object
            required: [job_id]
            properties:
              job_id:
                type: string
    IcebergError:
      description: Iceberg REST error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IcebergErrorModel'
    IcebergUnauthorized:
      description: Missing or invalid runtime token (NotAuthorizedException).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IcebergErrorModel'
    IcebergForbidden:
      description: Untrusted Host or refused operation (ForbiddenException).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IcebergErrorModel'
  schemas:
    FreeObject:
      type: object
      description: Free-form object (built by a service layer; not resolved statically).
      additionalProperties: true
    HTTPError:
      type: object
      required: [detail]
      properties:
        detail:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/CodedError'
            - type: array
              items:
                $ref: '#/components/schemas/ValidationErrorItem'
    CodedError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      additionalProperties: true
    ValidationErrorItem:
      type: object
      properties:
        loc:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string
    HTTPValidationError:
      type: object
      properties:
