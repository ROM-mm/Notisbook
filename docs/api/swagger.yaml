openapi: 3.0.3
info:
  title: Notisbook local backend API
  version: 0.9.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: |
    HTTP API of the Notisbook local backend (FastAPI), derived by static analysis of
    `backend/src/notisbook/app.py`, `backend/src/notisbook/security.py` and
    `backend/src/notisbook/api/*.py`. The running application does NOT expose an OpenAPI
    document: `docs_url`, `redoc_url` and `openapi_url` are all disabled in `create_app`.

    ## Server
    The backend listens on loopback only (`127.0.0.1`, default port `8765`).
    Every HTTP response carries the unauthenticated marker header `X-Notisbook: 1`
    (added by the `identify` middleware) so that launchers can tell a Notisbook backend
    from another process on the same port.

    ## Credentials
    Three disjoint credentials exist; none is accepted on another credential's routes.

    1. **UI token** (`require_token`): protects the UI API under `/api/**` (except
       `/api/runtime-catalog/**` and `/api/lifecycle/**`). Accepted as
       `Authorization: Bearer <token>`, as the `notisbook_token` cookie, or as the
       `?token=` query parameter. When the query parameter is valid, the response sets the
       `notisbook_token` cookie (`HttpOnly`, `SameSite=Strict`, `Path=/`). Missing or invalid
       token: `401 {"detail": "Unauthorized"}`.
    2. **Runtime token** (`require_runtime_token`): one per Docker or DuckDB kernel session,
       generated in memory by the backend and revoked with the session. Only
       `Authorization: Bearer <token>` is accepted. Protects `/api/runtime-catalog/**` and
       `/iceberg/**`.
    3. **Shutdown token** (`LifecycleControl`): one per backend run, written to
       `<home>/run/backend.json` (mode 0600). Only `Authorization: Bearer <token>` on
       `POST /api/lifecycle/shutdown`, from a loopback client.

    ## Host guards
    Several routers add a DNS-rebinding guard after the token check (401 first, then 403):
    `require_trusted_host` accepts only `Host: 127.0.0.1:<port>` or `localhost:<port>`;
    `require_runtime_host` additionally accepts `host.lima.internal:<port>` (the host through
    which the Docker container reaches the backend). A rejected Host yields
    `403 {"detail": "Forbidden host"}`.

    ## Error bodies
    FastAPI routes answer errors as `{"detail": ...}` where `detail` is a string, an object
    `{"code", "message"}`, or a list of validation items. The Iceberg REST catalog
    (`/iceberg/**`) always answers errors as the Iceberg `ErrorModel`
    `{"error": {"message", "type", "code"}}`, including 401/403 authentication failures.

    ## Root generation
    Mutating `/api/contents/{path}` routes and `POST /api/sessions` accept the optional header
    `X-Notisbook-Root-Generation`. When it is present and differs from the current notebooks-root
    generation, the request fails with `409 {"detail": "root_changed"}`.

    ## WebSockets (not representable in OpenAPI 3.0)
    All WebSocket routes run `guard_websocket` before `accept()`: the UI token (Bearer header,
    `notisbook_token` cookie or `?token=`), an `Origin` in
    `http://127.0.0.1:<port>` / `http://localhost:<port>` and a trusted `Host` are all required;
    otherwise the handshake is refused (close code 1008, seen by the client as HTTP 403).

    - `WS /api/ws/ping`: accepts, sends the text frame `pong` and closes.
    - `WS /api/jobs/{job_id}/events`: streams the job log as JSON frames
      `{"phase": string, "line": string, "progress"?: number}` (accumulated log first, then
      live events) and closes after the terminal event (`phase: "done"`). Unknown job:
      accepted and closed with code `4404`.
    - `WS /api/sessions/{session_id}/channel`: kernel channel, protocol v1
      (`kernels/protocol.py`). Unknown session: accepted and closed with code `4404`. A newer
      connection to the same session replaces the previous one, which is closed with code `4409`.
      On connect the server sends a `status` frame (and, if pending, an `error` frame with the
      S3A notice). Every frame is a JSON object with `v: 1` and a `type` discriminator.
      - Client -> server:
        - `{"v": 1, "type": "execute", "cell_id": string, "code": string, "language": "python" | "sql" | "duckdb"}` (`language` defaults to `python`)
        - `{"v": 1, "type": "interrupt"}`
        - `{"v": 1, "type": "restart"}`
      - Server -> client:
        - `{"v": 1, "type": "status", "state": "starting" | "idle" | "busy" | "restarting" | "dead"}`
        - `{"v": 1, "type": "execute_input", "cell_id": string, "execution_count": integer | null}`
        - `{"v": 1, "type": "output", "cell_id": string, "output": object}`
        - `{"v": 1, "type": "clear_output", "cell_id": string, "wait": boolean}`
        - `{"v": 1, "type": "execute_reply", "cell_id": string, "status": "ok" | "error" | "aborted", "execution_count": integer | null}`
        - `{"v": 1, "type": "error", "code": string, "message": string}`; an invalid client frame
          yields `code: "bad_message"`.

    ## Frontend
    `mount_frontend` registers the static mount `/assets` (Starlette `StaticFiles`, not a
    FastAPI route) and the public SPA fallback `/{path}` (`include_in_schema=False`), which is
    documented below for completeness.
  x-notisbook-coverage:
    source: static analysis of backend/src/notisbook (app.py, security.py, api/*.py, kernels/protocol.py, static.py)
    version-source: backend/pyproject.toml [project].version
    http-operations: 85
    websockets:
      - /api/ws/ping
      - /api/jobs/{job_id}/events
      - /api/sessions/{session_id}/channel
    dynamic-routes:
      - route: /api/contents/{path:path}
        note: Starlette `path` converter; `path` may contain `/`. Represented as `/api/contents/{path}`.
      - route: /iceberg/{rest:path}
        note: Catch-all for unknown Iceberg REST routes (GET, HEAD, POST, PUT, DELETE, PATCH), always 404 NoSuchRouteException. Represented as `/iceberg/{rest}`; `rest` may contain `/`.
      - route: /{path:path}
        note: SPA fallback registered by `mount_frontend` (GET, HEAD, include_in_schema=False, public). Represented as `/{path}`; `path` may contain `/`.
      - route: /assets
        note: Static files mount (Starlette `StaticFiles`), only registered when `frontend/dist/assets` exists; file names are build artifacts and are not resolvable statically. Not listed under `paths`.
    limitations:
      - Many handlers return untyped `dict[str, Any]`; their response schemas list only the keys built literally in the router and fall back to free-form objects where the payload comes from service layers (Docker runtime describe/details, catalog readers, DuckDB installed entry, Spark installed entries, Iceberg table metadata).
      - Error status codes are those raised in the routers and in the security dependencies; errors raised inside service layers beyond the mapped exceptions are not enumerated.
      - Iceberg REST request bodies are read as raw JSON (not Pydantic models); their schemas reflect the fields read by the handlers.
servers:
  - url: http://127.0.0.1:{port}
    description: Local Notisbook backend (loopback only)
    variables:
      port:
        default: '8765'
tags:
  - name: system
    description: Health, prerequisites and host resources.
  - name: appearance
    description: Appearance helpers.
  - name: contents
    description: Notebooks and folders under the notebooks root.
  - name: export
    description: Stateless notebook export.
  - name: files
    description: File-system shortcuts, listing and native folder picker.
  - name: notebooks-root
    description: Notebooks root folder.
  - name: samples
    description: Bundled sample notebooks present in the root.
  - name: sessions
    description: Kernelspecs and kernel sessions.
  - name: catalog
    description: Persistent catalog (catalog.db) read and schema operations for the UI.
  - name: runtime-catalog
    description: Catalog registry for the Docker runtime kernel (runtime token).
  - name: iceberg
    description: Iceberg REST catalog for the Docker runtime kernel (runtime token).
  - name: spark
    description: Local Spark versions and libraries.
  - name: docker
    description: Docker runtimes.
  - name: duckdb
    description: DuckDB runtime.
  - name: jobs
    description: Background job status.
  - name: notislake
    description: Local MinIO (notislake) status, manual S3 configuration and bucket listing.
  - name: lifecycle
    description: Ordered backend shutdown.
  - name: frontend
    description: Built frontend (SPA) serving.
paths:
  /api/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Health check
      security: &ui
        - uiBearer: []
        - uiCookie: []
        - uiQuery: []
      responses:
        '200':
          description: Backend is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/system/prereqs:
    get:
      tags: [system]
      operationId: getPrereqs
      summary: Check local prerequisites (uv, Java)
      security: *ui
      responses:
        '200':
          description: Prerequisite report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prereqs'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/system/resources:
    get:
      tags: [system]
      operationId: getSystemResources
      summary: Host memory, CPU and disk usage
      description: Each metric is `null` when it cannot be collected.
      security: *ui
      responses:
        '200':
          description: Resource snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemResources'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenHost'
  /api/appearance/system-fonts:
    get:
      tags: [appearance]
      operationId: getSystemFonts
      summary: List installed system font families
      security: *ui
      parameters:
        - name: refresh
          in: query
          required: false
          description: Bypass the in-memory cache.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Font families.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemFonts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenHost'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/contents:
    get:
      tags: [contents]
      operationId: listContents
      summary: List a folder under the notebooks root
      security: *ui
      parameters:
        - name: path
          in: query
          required: false
          description: Folder path relative to the notebooks root (empty for the root).
          schema:
            type: string
            default: ''
      responses:
        '200':
          description: Folder entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentEntry'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/contents/{path}:
    parameters:
      - $ref: '#/components/parameters/ContentPath'
    get:
      tags: [contents]
      operationId: readNotebook
      summary: Read a notebook
      security: *ui
      responses:
        '200':
          description: Notebook document (nbformat v4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notebook'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    put:
      tags: [contents]
      operationId: saveNotebook
      summary: Save a notebook
      security: *ui
      parameters:
        - $ref: '#/components/parameters/RootGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Notebook'
      responses:
        '200':
          description: Saved entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentEntry'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    post:
      tags: [contents]
      operationId: createItem
      summary: Create a notebook or a folder
      security: *ui
      parameters:
        - $ref: '#/components/parameters/RootGeneration'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContentBody'
      responses:
        '201':
          description: Created entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentEntry'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [contents]
      operationId: renameItem
      summary: Rename or move a notebook or folder
      description: 409 `Notebook is open in a running kernel` when a session is open under the path.
      security: *ui
      parameters:
        - $ref: '#/components/parameters/RootGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameBody'
      responses:
        '200':
          description: Renamed entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentEntry'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [contents]
      operationId: deleteItem
      summary: Delete a notebook or folder
      description: 409 `Notebook is open in a running kernel` when a session is open under the path.
      security: *ui
      parameters:
        - $ref: '#/components/parameters/RootGeneration'
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/export/{fmt}:
    post:
      tags: [export]
      operationId: exportNotebook
      summary: Convert the notebook in the body into a downloadable file
      description: Stateless; nothing is read from or written to disk. The body is limited to 50 MB.
      security: *ui
      parameters:
        - name: fmt
          in: path
          required: true
          schema:
            type: string
            enum: [py, ipynb, html]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportBody'
      responses:
        '200':
          description: 'Exported file. `html` responses also carry `Content-Security-Policy: sandbox; default-src ''none''`.'
          headers:
            Content-Disposition:
              description: Attachment with ASCII and RFC 5987 UTF-8 file names.
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            text/x-python:
              schema:
                type: string
            application/x-ipynb+json:
              schema:
                type: string
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/fs/choose-dir:
    post:
      tags: [files]
      operationId: chooseDir
      summary: Open the native folder picker
      security: *ui
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChooseDirBody'
      responses:
        '200':
          description: 'Chosen folder, or `{"cancelled": true}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChooseDirResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenHost'
        '422':
          $ref: '#/components/responses/ValidationError'
      x-notisbook-note: Picker failures are mapped to `PickerError.status_code` (service-defined).
  /api/fs/places:
    get:
      tags: [files]
      operationId: getPlaces
      summary: List folder shortcuts
      security: *ui
      responses:
        '200':
          description: Shortcuts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Place'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenHost'
  /api/fs/list:
    get:
      tags: [files]
      operationId: listPath
      summary: List one directory level by absolute path (metadata only)
      security: *ui
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '200':
          description: Directory page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreeObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenHost'
        '422':
          $ref: '#/components/responses/ValidationError'
      x-notisbook-note: Browse failures are mapped to `BrowseError.status_code` (service-defined).
  /api/fs/dir:
    delete:
      tags: [files]
      operationId: deleteDir
      summary: Delete a folder recursively, or only a symlink
      description: |
        409 with codes `open_kernel`, `contains_catalog_tables` (with `tables` and `table_count`) or
        `delete_failed`; 500 `partial_delete`. Other refusals come from `browser.check_dir_delete`.
      security: *ui
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenHost'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/Error'
  /api/notebooks-root:
    get:
      tags: [notebooks-root]
      operationId: getNotebooksRoot
      summary: Current notebooks root
      security: *ui
      responses:
        '200':
          description: Root description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebooksRoot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenHost'
    put:
      tags: [notebooks-root]
      operationId: putNotebooksRoot
      summary: Change the notebooks root (persisted)
      description: |
        With `dry_run=true` only validates and returns `{path, name}`. 409 `locked` when the root is
        locked, 409 `sessions_active` when kernel sessions exist; 403 `Folder is not usable`;
        500 `Could not save the preference`. Other validation refusals come from `RootRejected`.
      security: *ui
      parameters:
        - name: dry_run
          in: query
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RootBody'
      responses:
        '200':
          description: New root description (or `{path, name}` on dry run).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebooksRoot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/Error'
  /api/samples:
    get:
      tags: [samples]
      operationId: listSamples
      summary: Bundled samples present in the notebooks root
      security: *ui
      responses:
        '200':
          description: Samples sorted by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenHost'
  /api/kernelspecs:
    get:
      tags: [sessions]
      operationId: listKernelspecs
      summary: List available kernelspecs
      security: *ui
      responses:
        '200':
          description: Kernelspecs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KernelSpecInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: List kernel sessions
      security: *ui
      responses:
        '200':
          description: Sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [sessions]
      operationId: createSession
      summary: Start a kernel session for a notebook
      description: |
        404 unknown kernel; 409 `root_changed`, Spark libraries being changed, runtime busy/missing,
        `{code: <CONFIG_INVALID_CODE>}` or `{code: <SPARK_ENV_OUTDATED_CODE>}`; 503 notislake
        unavailable (`{code: <NOTISLAKE_UNAVAILABLE_CODE>}`) or Docker unavailable.
      security: *ui
      parameters:
        - $ref: '#/components/parameters/RootGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionBody'
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/Error'
  /api/sessions/{session_id}:
    delete:
      tags: [sessions]
      operationId: deleteSession
      summary: Stop a kernel session
      security: *ui
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Session stopped.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Error'
  /api/catalog:
    get:
      tags: [catalog]
      operationId: getCatalog
      summary: Catalog tree (spark_catalog, iceberg, hudi)
      security: *ui
      responses:
        '200':
          description: Catalog tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogTree'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenHost'
        '503':
          $ref: '#/components/responses/Error'
  /api/catalog/columns:
    get:
      tags: [catalog]
      operationId: getCatalogColumns
      summary: Columns of a table
