  /api/runtime-catalog/plan:
    post:
      tags: [Runtime catalog]
      operationId: postRuntimeCatalogPlan
      summary: Apply a catalog plan from the runtime hook
      description: |
        Body read raw with an 8 MB cap. A malformed body refuses the whole plan (422, nothing written).
        Items `created`/`updated`/`renamed` are validated one by one: an item over a size/pattern limit
        or failing a location rule is returned in `rejected` (`key`, `reason`) and the others are
        committed in one transaction. The backend never deletes files: MANAGED `s3a` folders to delete
        are returned in `deletions` for the kernel.
      security:
        - runtimeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimePlan'
      responses:
        '200':
          description: Plan result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimePlanResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenHost'
        '413':
          description: '`body_too_large`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: '`invalid_json`, `plan_too_large`, or a list of `{loc, msg}` validation errors.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '503':
          $ref: '#/components/responses/CatalogBusy'
