openapi: 3.0.3
info:
  title: Notisbook HTTP API
  version: 0.10.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: |
    HTTP API of the Notisbook local backend (FastAPI), derived from static reading of
    `backend/src/notisbook/app.py` and the routers in `backend/src/notisbook/api/`.

    General behavior:
    - The server binds to loopback only (`127.0.0.1`); the bind host is not configurable.
    - The FastAPI built-in docs (`/docs`, `/redoc`, `/openapi.json`) are disabled.
    - An HTTP middleware adds the header `X-Notisbook: 1` to every HTTP response (it is not
      applied to WebSocket connections). It is an unauthenticated marker used to detect a
      Notisbook instance on the port.
    - Errors raised with FastAPI `HTTPException` are returned as `{"detail": ...}`, where
      `detail` is a string, an object (`{code, message, ...}`) or a list, depending on the route.
      Request validation failures of declared parameters/bodies return FastAPI's default 422
      body (`{"detail": [{loc, msg, type, ...}]}`).
    - Routes under `/iceberg` return errors as the Iceberg REST `ErrorModel`
      (`{"error": {message, type, code}}`), including authentication failures.

    Routes that are registered but not modeled as OpenAPI operations:
    - `GET|HEAD /{path}` (SPA fallback, `include_in_schema=False`, no authentication): serves
      files from the built frontend or `index.html` (with a `Content-Security-Policy` header);
      answers 404 for `api` and `api/...` paths and 503 (HTML page) when the frontend build is missing.
    - `/assets/*`: static mount of the frontend build assets (only when the `assets` folder exists).
    - `GET|HEAD|POST|PUT|DELETE|PATCH /iceberg/{rest}` (any sub-path): catch-all of the Iceberg
      router, registered after its specific routes; answers 404 `NoSuchRouteException`.
servers:
  - url: http://127.0.0.1:{port}
    description: Local backend (loopback only). `localhost:{port}` is also an allowed Host.
    variables:
      port:
        default: '8765'
        description: Value of `--port` (default `DEFAULT_PORT` in `config.py`).
security:
  - uiBearer: []
  - uiCookie: []
  - uiQueryToken: []
tags:
  - name: System
    description: Health, prerequisites, machine resources and the ping WebSocket.
  - name: Appearance
    description: Installed system fonts.
  - name: Contents
    description: Notebooks and folders under the current notebooks root.
  - name: Export
    description: Stateless notebook export (py, ipynb, html).
  - name: Files
    description: Absolute-path folder browsing, native folder picker and folder deletion.
  - name: Notebooks root
    description: Current notebooks root folder and its persisted change.
  - name: Samples
    description: Featured bundled samples present in the notebooks root.
  - name: Sessions
    description: Kernelspecs, kernel sessions and the per-session WebSocket channel.
  - name: Catalog
    description: Read/maintenance view of the persistent catalog (`<home>/catalog.db`) for the UI.
  - name: Runtime catalog
    description: |
      Catalog registry endpoints used by the kernel running in a Docker/DuckDB runtime. Authenticated
      only by the per-session runtime token (never the UI token); Host may also be `host.lima.internal:{port}`.
  - name: Iceberg REST
    description: |
      Iceberg REST catalog subset served to the Docker runtime kernel (no `prefix`). Same runtime token
      and Host rule as the runtime catalog. All errors use `IcebergErrorModel`. Namespace path
      parameters use the Iceberg multi-level encoding (levels separated by the 0x1F character).
  - name: Spark
    description: Managed Spark environments (versions, catalog, libraries).
  - name: DuckDB
    description: Managed DuckDB runtime versions, extensions and libraries.
  - name: Docker
    description: Docker runtimes (image/container lifecycle).
  - name: Jobs
    description: Long-running job status and live event stream.
  - name: Notislake
    description: |
      Local MinIO (notislake) status, manual S3 configuration, bucket listing and connection test.
      Every response of this router, including errors, carries `Cache-Control: no-store`.
  - name: Lifecycle
    description: Orderly shutdown of the backend, used by a newer instance.
paths:
  /api/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Health check
      responses:
        '200':
          description: Backend is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/system/prereqs:
    get:
      tags: [System]
      operationId: getSystemPrereqs
      summary: Check local prerequisites (uv, Java)
      responses:
        '200':
          description: Prerequisite probe result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prereqs'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/system/resources:
    get:
      tags: [System]
      operationId: getSystemResources
      summary: Memory, CPU and disk usage
      description: Each metric is `null` when it cannot be collected. Disk usage is measured on the notebooks root (falls back to the user home).
      responses:
        '200':
          description: Resource usage.
          content:
            application/json:
              schema:
                type: object
                required: [memory, cpu, disk]
                properties:
                  memory:
                    $ref: '#/components/schemas/UsedTotal'
                  cpu:
                    type: object
                    nullable: true
                    required: [percent, cores]
                    properties:
                      percent:
                        type: number
                      cores:
                        type: integer
                  disk:
                    $ref: '#/components/schemas/UsedTotal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenHost'
  /api/ws/ping:
    get:
      tags: [System]
      operationId: wsPing
      summary: WebSocket ping (upgrade)
      description: |
        WebSocket endpoint (HTTP Upgrade). Authentication is checked before accepting: the UI token
        (Bearer header, `notisbook_token` cookie or `token` query parameter) plus an `Origin` in
        `http://127.0.0.1:{port}` / `http://localhost:{port}` and a `Host` in `127.0.0.1:{port}` /
        `localhost:{port}`. On failure the handshake is refused (HTTP 403). After accepting, the
        server sends the text frame `pong` and closes the connection.
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '101':
          description: Switching Protocols (WebSocket accepted).
        '403':
          description: Handshake refused (token, Origin or Host check failed).
  /api/appearance/system-fonts:
    get:
      tags: [Appearance]
      operationId: getSystemFonts
      summary: List installed font families
      description: Uses an in-memory cache; `refresh=true` recomputes it. On non-macOS platforms `status` is `unsupported`.
      parameters:
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Font families.
          content:
            application/json:
              schema:
                type: object
                required: [status, families]
                properties:
                  status:
                    type: string
                    enum: [ok, unsupported, unavailable]
                  families:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenHost'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/contents:
    get:
      tags: [Contents]
      operationId: listContents
      summary: List a folder under the notebooks root
      parameters:
        - name: path
          in: query
          required: false
          description: Path relative to the notebooks root; empty for the root itself.
          schema:
            type: string
            default: ''
      responses:
        '200':
          description: Folder entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentEntry'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/contents/{path}:
    parameters:
      - $ref: '#/components/parameters/ContentPath'
    get:
      tags: [Contents]
      operationId: readNotebook
      summary: Read a notebook
      responses:
        '200':
          description: The notebook as nbformat v4 JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notebook'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    put:
      tags: [Contents]
      operationId: saveNotebook
      summary: Save a notebook
      description: Only `.ipynb` paths can be written. The notebook is validated as nbformat v4 and missing cell ids are added.
      parameters:
        - $ref: '#/components/parameters/RootGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Notebook'
      responses:
        '200':
          description: Saved entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentEntry'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: '`root_changed`: the `X-Notisbook-Root-Generation` header does not match the current generation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          $ref: '#/components/responses/Error'
    post:
      tags: [Contents]
      operationId: createContentItem
      summary: Create a notebook or a folder
      parameters:
        - $ref: '#/components/parameters/RootGeneration'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [notebook, directory]
                  default: notebook
      responses:
        '201':
          description: Created entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentEntry'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Already exists, or `root_changed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Contents]
      operationId: renameContentItem
      summary: Rename or move a notebook or folder
      parameters:
        - $ref: '#/components/parameters/RootGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_path]
              properties:
                new_path:
                  type: string
                  description: Destination path relative to the notebooks root.
      responses:
        '200':
          description: Renamed entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentEntry'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: '`Notebook is open in a running kernel`, destination already exists, or `root_changed`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Contents]
      operationId: deleteContentItem
      summary: Delete a notebook or folder
      parameters:
        - $ref: '#/components/parameters/RootGeneration'
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: '`Notebook is open in a running kernel`, deletion failure, or `root_changed`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '500':
          $ref: '#/components/responses/Error'
  /api/export/{fmt}:
    post:
      tags: [Export]
      operationId: exportNotebook
      summary: Export a notebook to a downloadable file
      description: |
        Stateless: nothing is read from or written to disk. The body is read raw (up to 50 MB) and
        parsed as JSON. `filename` only names the download (`Content-Disposition`). Responses carry
        `X-Content-Type-Options: nosniff` and `Cache-Control: no-store`; the `html` format also carries
        `Content-Security-Policy: sandbox; default-src 'none'`.
      parameters:
        - name: fmt
          in: path
          required: true
          schema:
            type: string
            enum: [py, ipynb, html]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notebook]
              properties:
                notebook:
                  $ref: '#/components/schemas/Notebook'
                filename:
                  type: string
                  default: ''
      responses:
        '200':
          description: Exported file.
          headers:
            Content-Disposition:
              description: Attachment with ASCII and UTF-8 file names.
              schema:
                type: string
          content:
            text/x-python:
              schema:
                type: string
            application/x-ipynb+json:
              schema:
                type: string
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          description: Invalid export request body, invalid notebook, or invalid `fmt`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
  /api/fs/choose-dir:
    post:
      tags: [Files]
      operationId: chooseDirectory
      summary: Open the native folder picker
      description: Blocks until the user chooses a folder or cancels. Only available on macOS.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                default_path:
                  type: string
                  nullable: true
                purpose:
                  type: string
                  enum: [data, notebooks]
                  default: data
      responses:
        '200':
          description: Chosen folder, or cancellation.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [path]
                    properties:
                      path:
                        type: string
                  - type: object
                    required: [cancelled]
                    properties:
                      cancelled:
                        type: boolean
                        enum: [true]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenHost'
        '409':
          description: A folder picker is already open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/Error'
        '501':
          description: The native picker is only available on macOS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '504':
          description: Timed out waiting for a folder to be chosen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
  /api/fs/places:
    get:
      tags: [Files]
      operationId: getPlaces
      summary: Folder shortcuts (Home, Notebooks, Root)
      responses:
        '200':
          description: Shortcuts.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [label, path]
                  properties:
                    label:
                      type: string
                    path:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenHost'
  /api/fs/list:
    get:
      tags: [Files]
      operationId: listDirectory
      summary: List one folder level by absolute path (metadata only)
      description: Directories first; symlinks are not traversed.
      parameters:
        - name: path
          in: query
          required: true
          description: Absolute path.
          schema:
            type: string
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '200':
          description: One page of the folder listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryListing'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden Host, or permission denied on the folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/fs/dir:
    delete:
      tags: [Files]
      operationId: deleteDirectory
      summary: Delete a folder (recursive) or only a symlink
      description: |
        Refusals use `detail = {code, message, ...}`. Codes: `invalid_path`, `not_a_directory` (400),
        `protected_path` (403), `path_not_found` (404), `open_kernel`, `contains_catalog_tables`
        (with `tables` and `table_count`), `delete_failed` (409), `partial_delete` (500),
        `catalog_unavailable` (503).
      parameters:
        - name: path
          in: query
          required: true
          description: Absolute, normalized path.
          schema:
            type: string
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/CodedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden Host, or `protected_path`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          $ref: '#/components/responses/CodedError'
        '409':
          $ref: '#/components/responses/CodedError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/CodedError'
        '503':
          $ref: '#/components/responses/CodedError'
  /api/notebooks-root:
    get:
      tags: [Notebooks root]
      operationId: getNotebooksRoot
      summary: Current notebooks root
      responses:
        '200':
          description: Current root.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebooksRoot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenHost'
    put:
      tags: [Notebooks root]
      operationId: putNotebooksRoot
      summary: Change (and persist) the notebooks root
      description: With `dry_run=true` only validates the folder and returns `{path, name}`; otherwise persists the preference, swaps the root and increments `generation`.
      parameters:
        - name: dry_run
          in: query
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
      responses:
        '200':
          description: New root (or the validated folder on dry run).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/NotebooksRoot'
                  - type: object
                    required: [path, name]
                    properties:
                      path:
                        type: string
                      name:
                        type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden Host, or folder not readable/writable/usable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: '`locked` (root fixed by CLI) or `sessions_active`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/Error'
  /api/samples:
    get:
      tags: [Samples]
      operationId: listSamples
      summary: Featured samples present in the notebooks root
      responses:
        '200':
          description: Samples, in display order.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, path, kernel_name, runtime_kind, display_name]
                  properties:
                    name:
                      type: string
                    path:
                      type: string
                    kernel_name:
                      type: string
                    runtime_kind:
                      $ref: '#/components/schemas/RuntimeKind'
                    display_name:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenHost'
  /api/kernelspecs:
    get:
      tags: [Sessions]
      operationId: listKernelspecs
      summary: Available kernelspecs
      responses:
        '200':
          description: Kernelspecs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KernelSpecInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: Active kernel sessions
      responses:
        '200':
          description: Sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Start a kernel session for a notebook
      parameters:
        - $ref: '#/components/parameters/RootGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, kernel_name]
              properties:
                path:
                  type: string
                  description: Notebook path relative to the notebooks root.
                kernel_name:
                  type: string
      responses:
        '201':
          description: Session created. `notice_code`/`notice_message` are present only when an S3A notice exists.
          content:
            application/json:
              schema:
                type: object
                required: [session_id]
                properties:
                  session_id:
                    type: string
                  notice_code:
                    type: string
                  notice_message:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: Kernel not found, or path not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '409':
          description: |
            `root_changed`; Spark libraries or DuckDB version being changed; Docker runtime installing,
            container missing or stale mounts; or `detail = {code, message}` with `code` in
            `config_invalid`, `runtime_not_installed`, `spark_env_outdated`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: '`detail = {code: notislake_unavailable, message}`, or Docker unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
  /api/sessions/{session_id}:
    delete:
      tags: [Sessions]
      operationId: deleteSession
      summary: Close a kernel session
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Session closed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Error'
  /api/sessions/{session_id}/channel:
    get:
      tags: [Sessions]
      operationId: sessionChannel
      summary: Kernel session WebSocket channel, protocol v1 (upgrade)
      description: |
        WebSocket endpoint (HTTP Upgrade). Same handshake guard as `/api/ws/ping` (UI token via
        Bearer/cookie/query, plus allowed `Origin` and `Host`); failure refuses the handshake (HTTP 403).
        Unknown session: accepted then closed with code 4404. A newer connection to the same session
        closes the previous one with code 4409.

        Every frame is a JSON object with `v: 1` and `type`.

        Client -> server:
        - `execute` `{cell_id, code, language: python|sql|duckdb (default python)}`
        - `interrupt` `{}`
        - `restart` `{}`

        Server -> client:
        - `status` `{state: starting|idle|busy|restarting|dead}` (sent first on connect)
        - `execute_input` `{cell_id, execution_count}`
        - `output` `{cell_id, output}` (an nbformat output object)
        - `clear_output` `{cell_id, wait}`
        - `execute_reply` `{cell_id, status: ok|error|aborted, execution_count}`
        - `error` `{code, message}`; `code: bad_message` for an invalid client frame; also used for a
          pending S3A notice right after connect.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '101':
          description: Switching Protocols (WebSocket accepted).
        '403':
          description: Handshake refused (token, Origin or Host check failed).
  /api/catalog:
    get:
      tags: [Catalog]
      operationId: getCatalogTree
      summary: Catalog tree (catalogs, databases, tables)
